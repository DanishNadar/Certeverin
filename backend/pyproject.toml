[project]
name = "certeverin"
version = "0.1.0"
description = "Evidence-based certification funding recommendations for AI/ML students."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "reportlab>=4.2",
  "pytest>=8.2",
  "python-multipart>=0.0.9"
]

[project.scripts]
certeverin = "app.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
