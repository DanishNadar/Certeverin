services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: certeverin
      POSTGRES_USER: certeverin
      POSTGRES_PASSWORD: certeverin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://certeverin:certeverin@postgres:5432/certeverin
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  postgres_data:
